[project]
name = "vk-tech-presentation-generator"
version = "0.1.0"
description = "Сервис для создания презентаций по шаблону"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.23",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["parser/tests", "generation/tests", "audit/tests"]